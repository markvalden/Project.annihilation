      background-position: center;
      background-repeat: no-repeat;
      background-size: auto 100%;
      border: 1px solid rgba(184,148,88,.32);
      box-shadow: 0 22px 80px rgba(0,0,0,.58), inset 0 0 50px rgba(0,0,0,.22);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(184,148,88,.22);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 370px;
      margin: auto;
    }

    .identity {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 27px;
    }

    .avatar-frame {
      flex: 0 0 124px;
      width: 124px;
      height: 124px;
      padding: 5px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      outline: 1px solid rgba(184,148,88,.72);
      outline-offset: 4px;
      background: rgba(9,7,8,.66);
      box-shadow: 0 0 24px rgba(0,0,0,.55), 0 0 18px rgba(75,16,37,.28);
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 42%;
      border: 1px solid rgba(232,223,210,.35);
    }

    .identity-copy {
      min-width: 0;
      text-align: left;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #d0b47f;
      font: 10px/1.5 Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f0e5d5;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.02;
      font-weight: 400;
      letter-spacing: .035em;
      text-shadow: 0 2px 15px rgba(0,0,0,.9);
    }

    .author-role {
      margin: 10px 0 0;
      color: #d0b47f;
      font: 9px/1.6 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .quote {
      margin: 0 auto 26px;
      max-width: 350px;
      color: #eee4d8;
      text-align: center;
      font-size: clamp(16px, 4.5vw, 19px);
      line-height: 1.5;
      font-style: italic;
      text-shadow: 0 2px 12px rgba(0,0,0,.95);
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 auto 23px;
      width: 74%;
      color: var(--gold);
      opacity: .9;
    }

    .ornament::before, .ornament::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .ornament::after { background: linear-gradient(90deg, var(--gold), transparent); }
    .ornament span { font-size: 14px; line-height: 1; }

    .links {
      display: grid;
      gap: 12px;
    }

    .link-card {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 19px;
      color: #f0e5d5;
      text-decoration: none;
      background: linear-gradient(110deg, rgba(12,10,11,.66), rgba(57,19,32,.40));
      border: 1px solid rgba(222,205,177,.32);
      border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease, background .24s ease;
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, #d0b47f, #681a36);
      opacity: .9;
    }

    .link-card:hover, .link-card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(208,180,127,.78);
      background: linear-gradient(110deg, rgba(20,13,16,.82), rgba(91,24,48,.62));
      box-shadow: 0 12px 24px rgba(0,0,0,.42), 0 5px 18px rgba(75,16,37,.24), inset 0 1px 0 rgba(255,255,255,.12);
      outline: none;
    }

    .link-label {
      font: 11px/1.3 Arial, sans-serif;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .link-hint {
      color: #d0b47f;
      font: 17px/1 Georgia, serif;
      transition: transform .24s ease;
    }
    .link-card:hover .link-hint { transform: translateX(4px); }

    .footer {
      margin-top: 25px;
      color: rgba(222,205,177,.72);
      text-align: center;
      font: 8px/1.6 Arial, sans-serif;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    @media (min-width: 700px) {
      body { padding: 42px; }
      .page {
        width: min(470px, calc(100vw - 40px));
        min-height: min(850px, calc(100vh - 84px));
        background-size: auto min(100%, 850px);
      }
    }

    @media (max-width: 380px) {
      body { padding: 14px 10px; }
      .page { min-height: calc(100vh - 28px); padding: 27px 19px 22px; }
      .identity { gap: 13px; }
      .avatar-frame { flex-basis: 106px; width: 106px; height: 106px; }
      .eyebrow { font-size: 8px; }
      .author-role { font-size: 8px; }
      .link-card { min-height: 54px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
