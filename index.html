
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090708">
<title>Марк Вальден</title>

<style>
:root {
  --black: #090708;
  --wine: #421321;
  --wine-light: #641d35;
  --gold: #b89458;
  --gold-soft: rgba(184,148,88,.55);
  --ivory: #e8dfd2;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--black);
}

body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  padding: 10px;
  display: flex;
  justify-content: center;
  align-items: stretch;
  overflow-x: hidden;
  color: var(--ivory);
  background: var(--black);
  font-family: Georgia, "Times New Roman", serif;
  position: relative;
  isolation: isolate;
}

body::before {
  content: "";
  position: fixed;
  inset: -30px;
  z-index: -2;
  background-image: url("https://upforme.ru/uploads/001c/a4/b9/103/84055.png");
  background-position: center;
  background-size: cover;
  filter: blur(25px) brightness(.32) saturate(.7);
  transform: scale(1.05);
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: rgba(9,7,8,.28);
}

.page {
  width: 100%;
  min-height: calc(100vh - 20px);
  min-height: calc(100svh - 20px);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
}

.page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image:
    linear-gradient(
      180deg,
      rgba(7,6,7,.12),
      rgba(7,6,7,.42)
    ),
    url("https://upforme.ru/uploads/001c/a4/b9/103/84055.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: auto 100%;
}

.page::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0;
  bottom: 0;
  left: 50%;
  width: min(100%, 490px);
  transform: translateX(-50%);
  border-left: 1px solid rgba(184,148,88,.2);
  border-right: 1px solid rgba(184,148,88,.2);
  pointer-events: none;
}

.content {
  width: 100%;
  max-width: 370px;
  padding: 35px 22px;
  margin: auto;
  position: relative;
  z-index: 1;
}

.identity {
  display: flex;
  flex-direction: row-reverse;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 30px;
}

.avatar-frame {
  flex: 0 0 124px;
  width: 124px;
  height: 124px;
  padding: 5px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  outline: 1px solid rgba(184,148,88,.65);
  outline-offset: 4px;
  background: rgba(9,7,8,.65);
  box-shadow: 0 5px 22px rgba(0,0,0,.5);
}

.avatar {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  object-position: 50% 42%;
  border: 1px solid rgba(232,223,210,.3);
}

.identity-copy {
  min-width: 0;
  text-align: left;
}

.eyebrow {
  margin: 0 0 10px;
  color: #c5a775;
  font: 10px/1.5 Arial, sans-serif;
  letter-spacing: .2em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: #eee4d8;
  font-size: clamp(25px, 7vw, 34px);
  line-height: 1.05;
  font-weight: 400;
  letter-spacing: .025em;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
}

.author-role {
  margin: 10px 0 0;
  color: #c5a775;
  font: 9px/1.6 Arial, sans-serif;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.quote {
  margin: 0 auto 25px;
  max-width: 350px;
  color: #eee4d8;
  text-align: center;
  font-size: clamp(16px, 4.5vw, 19px);
  line-height: 1.5;
  font-style: italic;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
}

.ornament {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 65%;
  margin: 0 auto 25px;
  color: var(--gold);
}

.ornament::before,
.ornament::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold)
  );
}

.ornament::after {
  background: linear-gradient(
    90deg,
    var(--gold),
    transparent
  );
}

.ornament span {
  font-size: 17px;
  line-height: 1;
}

.links {
  display: grid;
  gap: 13px;
}

.link-card {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px;

  color: #eee4d8;
  text-align: center;
  text-decoration: none;

  background: linear-gradient(
    115deg,
    rgba(48,14,27,.57),
    rgba(83,25,46,.43)
  );

  border: 1px solid rgba(184,148,88,.65);
  border-radius: 4px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    border-color .25s ease;
}

.link-label {
  font: 11px/1.5 Arial, sans-serif;
  letter-spacing: .17em;
  text-transform: uppercase;
}

.link-card:hover,
.link-card:focus-visible {
  transform: translateY(-4px);

  background: linear-gradient(
    115deg,
    rgba(77,20,40,.76),
    rgba(104,30,55,.62)
  );

  border-color: rgba(218,185,126,.95);

  box-shadow:
    0 10px 23px rgba(0,0,0,.38),
    0 5px 17px rgba(75,16,37,.25);

  outline: none;
}

.link-card:active {
  transform: translateY(-1px);
}

.footer {
  margin-top: 27px;
  color: rgba(222,205,177,.72);
  text-align: center;
  font: 8px/1.6 Arial, sans-serif;
  letter-spacing: .2em;
  text-transform: uppercase;
}

@media (max-width: 380px) {
  .content {
    padding: 25px 15px;
  }

  .identity {
    gap: 15px;
  }

  .avatar-frame {
    flex-basis: 106px;
    width: 106px;
    height: 106px;
  }

  .eyebrow,
  .author-role {
    font-size: 8px;
  }

  .link-card {
    min-height: 54px;
  }
}

@media (max-height: 650px) {
  .content {
    padding-top: 20px;
    padding-bottom: 20px;
  }

  .identity {
    margin-bottom: 20px;
  }

  .avatar-frame {
    flex-basis: 100px;
    width: 100px;
    height: 100px;
  }

  .quote {
    margin-bottom: 15px;
  }

  .ornament {
    margin-bottom: 15px;
  }

  .links {
    gap: 9px;
  }

  .link-card {
    min-height: 48px;
  }

  .footer {
    margin-top: 17px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="content">

    <header class="identity">

      <div class="avatar-frame">
        <img
          class="avatar"
          src="https://upforme.ru/uploads/001c/a4/b9/103/901361.webp"
          alt="Марк Вальден"
        >
      </div>

      <div class="identity-copy">
        <p class="eyebrow">Авторский мир</p>
        <h1>Марк<br>Вальден</h1>
        <p class="author-role">
          Писатель · Проект «Аннигиляция». Нулевой пациент
        </p>
      </div>

    </header>

    <p class="quote">
      Тьма живёт внутри каждого,
      а когда она выходит наружу,
      рождается творец
    </p>

    <div class="ornament" aria-hidden="true">
      <span>†</span>
    </div>

    <nav class="links" aria-label="Мои площадки">

      <a class="link-card" href="https://author.today/work/656595" target="_blank" rel="noopener noreferrer">
        <span class="link-label">Author Today</span>
      </a>

      <a class="link-card" href="https://litnet.com/ru/book/proekt-annigilyaciya-nulevoi-pacient-b631591" target="_blank" rel="noopener noreferrer">
        <span class="link-label">Litnet</span>
      </a>

      <a class="link-card" href="https://litgorod.ru/books/view/75625" target="_blank" rel="noopener noreferrer">
        <span class="link-label">Litgorod</span>
      </a>

      <a class="link-card" href="https://t.me/mark_valden" target="_blank" rel="noopener noreferrer">
        <span class="link-label">Телеграм канал</span>
      </a>

    </nav>

    <footer class="footer">
      Проект «Аннигиляция» · Нулевой пациент
    </footer>

  </div>

</main>

</body>
</html>
